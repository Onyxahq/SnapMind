[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/snapmind-core",
  "crates/snapmind-providers",
  "crates/snapmind-ocr",
  "crates/snapmind-platform",
]

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
snapmind-core = { path = "crates/snapmind-core" }
snapmind-platform = { path = "crates/snapmind-platform" }
snapmind-providers = { path = "crates/snapmind-providers" }
snapmind-ocr = { path = "crates/snapmind-ocr" }

# 截屏、图像编码在调试版里也要够快，否则测不出真实耗时：本项目的平台层和所有依赖都优化编译
[profile.dev.package.snapmind-platform]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

# OCR 的预处理（缩放、笔画测量）是逐像素的循环，按体积优化会慢一截
[profile.release.package.snapmind-ocr]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
