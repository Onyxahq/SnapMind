[package]
name = "snapmind"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "截图、贴图、OCR 与翻译"

[lib]
name = "snapmind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { workspace = true }
serde_json = { workspace = true }
snapmind-core = { workspace = true }
snapmind-platform = { workspace = true }
snapmind-providers = { workspace = true }
snapmind-ocr = { workspace = true }
# 下载 OCR 模型（与服务层同一个 reqwest，rustls）；校验 SHA-256
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
sha2 = "0.10.9"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-dialog = { version = "2.8.4", default-features = false }
