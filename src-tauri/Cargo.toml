[package]
name = "snapmind"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "截图、贴图、OCR 与翻译"

[lib]
name = "snapmind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：macOS 上透明窗口（截图遮罩、贴图、悬浮球）要用到；对 Windows 没有影响
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { workspace = true }
serde_json = { workspace = true }
snapmind-core = { workspace = true }
snapmind-platform = { workspace = true }
snapmind-providers = { workspace = true }
snapmind-ocr = { workspace = true }
# 下载 OCR 模型（与服务层同一个 reqwest，rustls）；校验 SHA-256
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
sha2 = "0.10.9"
# 表格导出 .xlsx（M8.2）
rust_xlsxwriter = { version = "0.103.0", default-features = false }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-dialog = { version = "2.8.4", default-features = false }
tauri-plugin-updater = "2"
