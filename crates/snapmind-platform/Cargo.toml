[package]
name = "snapmind-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
keyring = "4.2.0"
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Media_MediaFoundation",
  "Win32_Media_Audio",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }

# macOS：截屏用 ScreenCaptureKit（CGWindowListCreateImage 从 macOS 15 起已废弃不可用），窗口调整用 AppKit。
# 版本跟 Tauri（tao / wry）用的 objc2 系列一致，不多编一份。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-screen-capture-kit = { version = "0.3", features = ["objc2-core-media"] }
# 录屏：AVAssetWriter 写 H.264 + AAC 的 MP4（系统自带编码器，有硬件编码时自动用上）
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
